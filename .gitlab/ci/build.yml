# Combinations to use in schedules matrix

.combinations: &basic_combinations
  COMPILER: [gcc, clang]
  CMAKE_BUILD_TYPE: [Release, RelWithDebInfo, Debug]
  ASSERT_LEVEL: [NONE, NORMAL, PARANOID]

.dpdk_combinations: &basic_combinations_dpdk
  <<: *basic_combinations
  ENABLE_UHD: "False"
  ENABLE_ZEROMQ: "False"
  ENABLE_DPDK: "True"
  COMPILER: [gcc, clang]

######
# MR #
######

# Smoke builds in PR: with or without cache

smoke relwithdeb cached:
  extends: .smoke relwithdeb
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
      when: never
    - if: $ON_MR
  cache:
    - *cache_build_get

smoke tsan cached:
  extends: .smoke tsan
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
      when: never
    - if: $ON_MR
      when: manual
      allow_failure: true
  cache:
    - *cache_build_get

smoke asan cached:
  extends: .smoke asan
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
      when: never
    - if: $ON_MR
      when: manual
      allow_failure: true
  cache:
    - *cache_build_get

smoke rtsan cached:
  extends: .smoke rtsan
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
      when: never
    - if: $ON_MR
      when: manual
      allow_failure: true
  cache:
    - *cache_build_get

smoke archlinux cached:
  extends: .smoke archlinux
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
      when: never
    - if: $ON_MR
  cache:
    - *cache_build_get

smoke pretty printers cached:
  extends: .smoke printers
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
      when: never
    - if: $ON_MR
      changes: &gdb_printers_changes
