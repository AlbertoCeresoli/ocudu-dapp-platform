          - include/ocudu/adt/**/*
          - tests/utils/gdb/pretty_printers/*
          - utils/gdb/**/*
          - .gdbinit
  cache:
    - *cache_build_get

smoke relwithdeb clean:
  extends: .smoke relwithdeb
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/

smoke tsan clean:
  extends: .smoke tsan
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
      when: manual
      allow_failure: true

smoke asan clean:
  extends: .smoke asan
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
      when: manual
      allow_failure: true

smoke rtsan clean:
  extends: .smoke rtsan
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
      when: manual
      allow_failure: true

smoke archlinux clean:
  extends: .smoke archlinux
