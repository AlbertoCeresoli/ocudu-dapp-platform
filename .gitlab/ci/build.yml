      changes:
        <<: *gdb_printers_changes

# Intermediate commits

intermediate commits cached:
  extends: .smoke coverage
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/
      when: never
    - if: $ON_MR
  script:
    - *script_functions
    - &fetch_branches |
      cd $CI_PROJECT_DIR
      git config advice.detachedHead false
      unshallow_flag() {
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo --unshallow
        fi
      }
      if [ "$CI_PROJECT_PATH" = "$CI_MERGE_REQUEST_PROJECT_PATH" ]; then
        # job on target
        git fetch $(unshallow_flag) origin \
          "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" \
          "$CI_MERGE_REQUEST_REF_PATH:refs/mr-source-head"
        git branch -f "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        git branch -f "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" refs/mr-source-head
      else
        # job on the fork
        git fetch $(unshallow_flag) origin "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
        git branch -f "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" "origin/$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
        git remote get-url upstream >/dev/null 2>&1 || \
          git remote add upstream "$CI_MERGE_REQUEST_PROJECT_URL"
        git fetch $(unshallow_flag) upstream "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        git branch -f "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" "upstream/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      fi

      SOURCE_SHA=$(git rev-parse "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME")
      FORK_POINT=$(git merge-base "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME")
    - |
      for rev in $(git rev-list --reverse $FORK_POINT..$SOURCE_SHA)
      do
        echo "##################################################"
        echo "#### $rev ####"
        echo "##################################################"
        git checkout $rev
        build_ocudu_extended
      done
    - launch_tests_ocudu_extended
  cache:
    - *cache_build_get

intermediate commits clean:
  extends: intermediate commits cached
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-cache/

valgrind changed tests:
  extends: .smoke valgrind
  allow_failure:
    exit_codes: 124 # timeout command's exit code when the time is reached
  rules:
    - if: $CI_MERGE_REQUEST_LABELS =~ /ci-no-memcheck/
      when: never
    - if: $ON_MR
      when: manual
      allow_failure: true
  variables:
    CLEAN_BUILD: "False"
    FINGERPRINT: "fingerprints.csv"
    TEST_EXECUTION_TIMEOUT: 20m
  script:
    - *script_functions
    - *fetch_branches
    - |
      echo "##################################################"
      echo "#### $FORK_POINT ####"
      echo "##################################################"
      git checkout $FORK_POINT
      OUTPUT_FINGERPRINT="${FINGERPRINT}"
      build_ocudu_extended
      OUTPUT_FINGERPRINT=""
    - |
      echo "##################################################"
      echo "#### $SOURCE_SHA ####"
      echo "##################################################"
      git checkout $SOURCE_SHA
      build_ocudu_extended
    - echo "This test execution has a timeout of ${TEST_EXECUTION_TIMEOUT}. If the execution excess that timer, the job will be marked as allowed_to_fail. This will avoid the job to have a huge duration in a MR pipeline."
    - launch_tests_ocudu_extended
  cache:
    - *cache_build_get

###########
# Nightly #
###########
smoke coverage:
  extends: .smoke coverage
  rules:
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /Nightly/
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /Smoke/
    - if: $ON_PROTECTED_BRANCH

smoke asan:
  extends: .build_and_unit
  rules:
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /Nightly/
  variables:
    OS: ubuntu-24.04
    COMPILER: clang
    CMAKE_BUILD_TYPE: Debug
    ASSERT_LEVEL: PARANOID
    ENABLE_ASAN: "True"
    MARCH: x86-64-v3

smoke rtsan:
  extends: .build_and_unit
  rules:
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /Nightly/
  variables:
    OS: ubuntu-24.04-rtsan
    COMPILER: clang
    CMAKE_BUILD_TYPE: Debug
    ASSERT_LEVEL: PARANOID
    ENABLE_RTSAN: "True"
    ENABLE_WERROR: "False"
    TEST_MODE: rtsan
    MARCH: x86-64-v3

# CUDA jobs run on a project-provided shell runner so the test binary sees the host GPU and driver. Define
# OCUDU_CUDA_RUNNER_TAG and OCUDU_CUDA_ARCHITECTURES (for example, 121 on GB10) to enable this gate.
cuda pdsch issue 1 regression:
  stage: extended
  tags:
    - ${OCUDU_CUDA_RUNNER_TAG}
  rules:
    - if: '$OCUDU_CUDA_RUNNER_TAG && $OCUDU_CUDA_ARCHITECTURES && $ON_MR'
      changes:
        paths:
          - .gitlab/ci/build.yml
          - CMakeLists.txt
          - cmake/**/*
          - lib/phy/cuda/**/*
          - lib/phy/upper/channel_coding/ldpc/cuda/**/*
          - lib/phy/upper/channel_processors/pdsch/**/*
          - lib/phy/upper/resource_grid_cuda_visible*
          - tests/integrationtests/phy/upper/channel_processors/**/*
    - if: '$OCUDU_CUDA_RUNNER_TAG && $OCUDU_CUDA_ARCHITECTURES && $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /CUDA/'
    - if: '$OCUDU_CUDA_RUNNER_TAG && $OCUDU_CUDA_ARCHITECTURES && $ON_WEB'
      when: manual
  variables:
    CUDA_PDSCH_BUILD_DIR: build-cuda-pdsch-ci
  script:
    - nvidia-smi
    - nvcc --version
    - |
      cmake -S . -B "${CUDA_PDSCH_BUILD_DIR}" \
        -DCMAKE_BUILD_TYPE=Release \
        -DENABLE_CUDA=ON \
        -DCMAKE_CUDA_ARCHITECTURES="${OCUDU_CUDA_ARCHITECTURES}" \
        -DBUILD_TESTING=ON
    - cmake --build "${CUDA_PDSCH_BUILD_DIR}" --target pdsch_gpu_e2e_test -j"$(nproc)"
    - |
      ctest --test-dir "${CUDA_PDSCH_BUILD_DIR}" \
        --output-on-failure \
        --output-junit cuda-pdsch-issue-1.xml \
        -j1 \
        -R '^pdsch_gpu_issue_1_regression$'
  artifacts:
    when: always
    reports:
      junit: ${CUDA_PDSCH_BUILD_DIR}/cuda-pdsch-issue-1.xml
    paths:
      - ${CUDA_PDSCH_BUILD_DIR}/cuda-pdsch-issue-1.xml
      - ${CUDA_PDSCH_BUILD_DIR}/Testing/Temporary/LastTest.log
    expire_in: 5 days

# Keep the dApp/E3 lifecycle and process-security boundary green in clean GCC,
# Clang, and sanitizer trees. The SDK repository owns its full reference-suite
# matrix; these jobs protect the host side of that interface.
dapp interoperability release gate:
  extends: .build_and_unit_template
  stage: build and unit tests
  # Independent of the ci stage: runs even when an unrelated trigger fails.
  needs: []
  # Required for every MR/default-branch/tag pipeline, not an opt-in/manual job.
  rules:
    - if: '$ON_MR || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
  tags:
    - ${OCUDU_INTEROP_RUNNER_TAG}
  variables:
    OCUDU_INTEROP_RUNNER_TAG: saas-linux-large-amd64
    OS: ubuntu-24.04
    OCUDU_BUILD_DIR: build-dapp-interop-ci
    GIT_SUBMODULE_STRATEGY: recursive
    OCUDU_DAPP_SDK_URL: https://gitlab.com/ocudu/work_groups/wg2_ai_ran/ocudu-dapp-sdk.git
    OCUDU_DAPP_SDK_REF: a8948460e2a45d5bcd1f8f6c9abfc75f89c98982
  script:
    # E3AP, E3DP and the agent's SCTP carrier need kernel SCTP. Without it this job is skipped (it passes
    # and says so); libe3 interoperability is still exercised over ZMQ by "libe3 interoperability report".
    - |
      if ! python3 -c "import socket; socket.socket(socket.AF_INET, socket.SOCK_STREAM, socket.IPPROTO_SCTP).close()"; then
        echo "SKIPPED: this runner's kernel cannot open SCTP sockets (no sctp module); the SCTP E3 gate did not run."
        echo "Run it on a runner with the sctp kernel module by setting OCUDU_INTEROP_RUNNER_TAG."
        exit 0
      fi
    - apt-get update
    - apt-get install --no-install-recommends -y autoconf automake libtool bison flex libsctp-dev libzmq3-dev libprotobuf-dev protobuf-compiler flatbuffers-compiler libflatbuffers-dev clang python3-pip
    - python3 -m pip install --break-system-packages 'asn1tools>=0.166,<1' numpy h5py flatbuffers
    - >-
      builder.sh -b "${OCUDU_BUILD_DIR}" -c gcc
      -m "-j${CPU_JOBS} dapp_runtime_test dapp_e3ap_protobuf_conformance_test dapp_telemetry_allocation_test e3ap_test_server libe3_interop_dapp libe3_interop_vectors ocudu-dappctl ocudu-pusch-replay"
      -DCMAKE_BUILD_TYPE=Release -DENABLE_DAPP=ON -DENABLE_E3=ON
      -DENABLE_E3_ASN1_CODEC=ON -DOCUDU_DAPP_LIBE3_INTEROP=ON -DENABLE_UHD=OFF .
    - python3 scripts/check_dapp_interop_gate.py --build "${OCUDU_BUILD_DIR}"
    - cmake --install "${OCUDU_BUILD_DIR}" --prefix "${CI_PROJECT_DIR}/interop-install" --component dapp_sdk
    - git clone --no-checkout "${OCUDU_DAPP_SDK_URL}" interop-sdk
    - git -C interop-sdk checkout --detach "${OCUDU_DAPP_SDK_REF}"
    - >-
      cmake -S interop-sdk -B interop-sdk-build
      -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${CI_PROJECT_DIR}/interop-install"
      -DOCUDU_DAPP_BUILD_CUDA_EXAMPLES=OFF -DOCUDU_DAPP_BUILD_PYTHON_CLASS_C=OFF
      -DOCUDU_DAPP_REF_EXTRAS=ON -DOCUDU_DAPP_REQUIRE_ABI_COMPILER_MATRIX=ON
      -DOCUDU_DAPP_REQUIRE_PYTHON_EXAMPLES=ON
    - cmake --build interop-sdk-build --parallel "${CPU_JOBS}"
    - OCUDU_E3AP_TEST_SERVER="${CI_PROJECT_DIR}/${OCUDU_BUILD_DIR}/tests/unittests/dapp/e3ap_test_server" python3 scripts/check_dapp_interop_gate.py --profile sdk --build interop-sdk-build
  artifacts:
    when: always
    reports:
      junit:
        - build-dapp-interop-ci/dapp-interop.xml
        - interop-sdk-build/dapp-interop.xml
    paths:
      - build-dapp-interop-ci/dapp-interop.log
      - interop-sdk-build/dapp-interop.log
    expire_in: 30 days

# libe3 interoperability, as a report. Builds the host gate targets and the
# pinned upstream libe3 (submodules, with ZMQ, Protobuf and the SCTP association
# link layer), runs the fail-closed gate through scripts/libe3_interop_report.py and
# publishes the rendered report (Markdown and PDF) beside the JUnit results,
# exposed on the merge request. Runs on every runner: with kernel SCTP the gate
# covers both libe3 link layers (profile host); without it, the ZMQ link layer
# (profile zmq) and the report records SCTP as skipped. Every link layer runs in
# both libe3 encodings (APER and Protobuf). The job fails with the
# gate; the report of a failed run is still published.
libe3 interoperability report:
  extends: .build_and_unit_template
  stage: build and unit tests
  # Independent of the ci stage: runs even when an unrelated trigger fails.
  needs: []
  rules:
    - if: '$ON_MR || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
  tags:
    - ${OCUDU_INTEROP_RUNNER_TAG}
  variables:
    OCUDU_INTEROP_RUNNER_TAG: saas-linux-large-amd64
    OS: ubuntu-24.04
    OCUDU_BUILD_DIR: build-dapp-libe3-ci
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - |
      if python3 -c "import socket; socket.socket(socket.AF_INET, socket.SOCK_STREAM, socket.IPPROTO_SCTP).close()"; then
        export LIBE3_GATE_PROFILE=host
      else
        echo "No kernel SCTP on this runner: the libe3 SCTP link layer is skipped, ZMQ is tested."
        export LIBE3_GATE_PROFILE=zmq
      fi
    - apt-get update
    - >-
      apt-get install --no-install-recommends -y autoconf automake libtool bison flex libsctp-dev libzmq3-dev
      libprotobuf-dev protobuf-compiler flatbuffers-compiler libflatbuffers-dev clang python3-pip
      texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended cm-super
    - python3 -m pip install --break-system-packages 'asn1tools>=0.166,<1' numpy
    - >-
      builder.sh -b "${OCUDU_BUILD_DIR}" -c gcc
      -m "-j${CPU_JOBS} dapp_runtime_test dapp_e3ap_protobuf_conformance_test dapp_telemetry_allocation_test e3ap_test_server libe3_interop_dapp libe3_interop_vectors ocudu-dappctl"
      -DCMAKE_BUILD_TYPE=Release -DENABLE_DAPP=ON -DENABLE_E3=ON
      -DENABLE_E3_ASN1_CODEC=ON -DOCUDU_DAPP_LIBE3_INTEROP=ON -DENABLE_UHD=OFF .
    - python3 scripts/libe3_interop_report.py --build "${OCUDU_BUILD_DIR}" --out libe3-interop-report --profile "${LIBE3_GATE_PROFILE}"
    - test -f libe3-interop-report/libe3_interop_report.pdf
  artifacts:
    when: always
    name: "libe3-interop-report-${CI_COMMIT_SHORT_SHA}"
    expose_as: "libe3 interoperability report"
    reports:
      junit:
        - libe3-interop-report/dapp-interop.xml
    paths:
      - libe3-interop-report/
    expire_in: 90 days

dapp host cpu matrix:
  extends: .build_and_unit_template
  stage: build and unit tests
  rules:
    - if: $ON_MR
      changes:
        paths:
          - .gitlab/ci/build.yml
          - apps/services/dapp/**/*
          - include/ocudu/dapp/**/*
          - lib/dapp/**/*
          - lib/phy/upper/dapp/**/*
          - schemas/dapp/**/*
          - schemas/e3/**/*
          - tests/unittests/dapp/**/*
          - tests/unittests/phy/upper/dapp_data_router_test.cpp
    - if: $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /Nightly/
  variables:
    OS: ubuntu-24.04
    OCUDU_BUILD_DIR: build-dapp-host-ci
  parallel:
    matrix:
      - COMPILER: gcc
        CMAKE_BUILD_TYPE: Release
        DAPP_SANITIZER_ARGS: ""
      - COMPILER: clang
        CMAKE_BUILD_TYPE: Debug
        DAPP_SANITIZER_ARGS: "-DENABLE_ASAN=ON -DENABLE_UBSAN=ON"
  script:
    - >-
      builder.sh -b "${OCUDU_BUILD_DIR}" -c "${COMPILER}"
      -m "-j${CPU_JOBS} dapp_runtime_test dapp_hook_provider_test"
      -r
      -DCMAKE_BUILD_TYPE="${CMAKE_BUILD_TYPE}"
      -DENABLE_DAPP=ON
      -DENABLE_E3=ON
      -DENABLE_E3_ASN1_CODEC=ON
      -DENABLE_UHD=OFF
      ${DAPP_SANITIZER_ARGS}
      .
    - >-
      ctest --test-dir "${OCUDU_BUILD_DIR}" --output-on-failure
      --output-junit dapp-host.xml -j1
      -R '^(dapp_class_c_process_supervisor\.|dapp_config\.|dapp_data_router\.)'
  artifacts:
    when: always
    reports:
      junit: ${OCUDU_BUILD_DIR}/dapp-host.xml
    paths:
      - ${OCUDU_BUILD_DIR}/dapp-host.xml
      - ${OCUDU_BUILD_DIR}/Testing/Temporary/LastTest.log
    expire_in: 14 days

